<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>project 1</title>

<style>
  *{
    box-sizing: border-box;
}

body{
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: rgba(255, 208, 0, 0.941);
    font-family: Arial, sans-serif;
}

.box-page{
    padding: 20px;
    border: 1px solid black;
    border-radius: 20px;
    background-color: white;
    box-shadow: 8px 8px 0 0 black;
    width: 350px;
}

.box-page img{
    border-radius: 10px;
    width: 100%;
}

.text h5{
    display: inline-block;
    background-color: rgba(255, 208, 0, 0.941);
    padding: 6px 12px;
    border-radius: 5px;
    margin-top: 15px;
}

.text p{
    line-height: 1.5;
    color: gray;
}

.text h2{
    margin: 15px 0;
}

.icon{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
    font-weight: bold;
}

.icon img{
    width: 35px;
}  
</style>
</head>

<body>

<div class="box-page">

<!-- FIX: forward slashes -->
<img src="./illustration-article.svg" alt="icon">

<div class="content">
<div class="text">

<h5>Learning</h5>

<p><b>Published 21 Dec 2023</b></p>

<p>

website, defining structure, content, and <br>
presentation.
</p>

</div>

<div class="icon">

Greg Hooper
</div>

</div>    
</div>

</body>
</html>
